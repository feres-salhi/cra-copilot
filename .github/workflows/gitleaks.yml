# Secret scan: fails the check if a key or password is found anywhere in the repo history.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read   # the scan lists the commits of a pull request

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # scan the whole history, not just the last commit
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
