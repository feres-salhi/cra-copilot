# Secret scan: fails the check if a key or password is found anywhere in the repo history.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read   # the scan lists the commits of a pull request

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just the last commit
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
